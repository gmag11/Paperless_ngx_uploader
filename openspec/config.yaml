schema: spec-driven
githubCopilot:
  cloudAgent: false

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Language policy — MANDATORY: every OpenSpec artifact (proposal, design,
  tasks, and all spec deltas) MUST be written in English. This applies no
  matter which language the conversation, the user request, or an existing
  document uses. Never author or update a change in Spanish; if an existing
  artifact is in Spanish, translate it fully to English instead of continuing
  in Spanish. UI labels quoted from the app may keep their localized form
  (e.g. the Android "Abrir con" / "Open with" chooser) when the artifact
  refers to them.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
