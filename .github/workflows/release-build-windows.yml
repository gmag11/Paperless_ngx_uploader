name: Build Windows and Create Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. 1.8.5)'
        required: true
        type: string

jobs:
  windows:
    name: Build Windows and create installer
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Ensure Inno Setup is available
        shell: powershell
        run: |
          # Inno Setup ships with the windows-2022 runner image; install it with
          # Chocolatey only if a future image drops it.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'Inno Setup not found on the runner image; installing it with Chocolatey'
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc"
            exit 1
          }
          Write-Host "Found ISCC at $iscc"

      - name: Build installer (PowerShell script)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\scripts\build_and_package.ps1

      - name: Verify installer exists
        shell: powershell
        run: |
          $installer = Resolve-Path -Path "windows\installer\Output\PaperlessNGX_Uploader_Installer_Windows_x64.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "Installer not found at windows\\installer\\Output\\PaperlessNGX_Uploader_Installer_Windows_x64.exe"
            exit 1
          }
          Write-Host "Installer found: $($installer.Path)"

      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: windows/installer/Output/PaperlessNGX_Uploader_Installer_Windows_x64.exe
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          overwrite_files: true
          token: ${{ secrets.TOKEN }}
